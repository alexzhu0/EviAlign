[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentharness"
version = "0.2.0a1"
description = "ActLumen: pre-execution evidence for reviewable AI actions in enterprise workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
agentharness = "agentharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
